name: Import anonymous material files
on:
  push:
    paths:
      - '.github/import-manifest.json'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified material files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64,hashlib,tarfile,tempfile
          from pathlib import Path,PurePosixPath
          manifest=json.loads(Path('.github/import-manifest.json').read_text())
          expected='LeileiZhang0136/MCL-Bench-review-materials'
          assert os.environ['GH_REPOSITORY']==expected
          work=Path(tempfile.mkdtemp(prefix='material-import-'))
          archive=work/'materials.tar.gz'
          with archive.open('wb') as dst:
              for i,part in enumerate(manifest['parts'],1):
                  url=os.environ['GH_API_URL']+'/repos/'+expected+'/git/blobs/'+part['sha']
                  req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(req,timeout=120) as response: payload=json.load(response)
                  data=base64.b64decode(payload['content'])
                  assert hashlib.sha256(data).hexdigest()==part['sha256']
                  dst.write(data)
                  print('Downloaded verified part',i,'of',len(manifest['parts']),flush=True)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==manifest['archive_sha256']
          root=Path.cwd().resolve()
          with tarfile.open(archive,'r:gz') as tf:
              for member in tf.getmembers():
                  p=PurePosixPath(member.name)
                  assert member.isfile() and not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  dest=root.joinpath(*p.parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  with tf.extractfile(member) as src: dest.write_bytes(src.read())
          for line in Path('SHA256SUMS').read_text().splitlines():
              sha,name=line.split('  ',1)
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==sha,name
          assert len(manifest['files'])==2257
          for name in manifest['files']: assert Path(name).is_file()
          Path('.github/import-manifest.json').unlink()
          Path('.github/workflows/import-materials.yml').unlink()
          print('Verified and restored',len(manifest['files']),'ordinary material files.')
          PY
          git config user.name 'Anonymous Authors'
          git config user.email 'anonymous@invalid.example'
          git add -A
          git diff --cached --quiet || git commit -m 'Publish anonymous benchmark material files'
          git push origin HEAD:main
